<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#1C2B4A" />
<title>Sem conexão — Moto Passaporte</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #EEF1EA; color: #1C2B4A;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 22rem; padding: 2rem; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 1.4rem; margin: 1.2rem 0 .5rem; }
  p { color: #4a5568; line-height: 1.5; margin: 0 0 1.5rem; }
  button { background: #1C2B4A; color: #fff; border: 0; border-radius: 8px; padding: .8rem 1.4rem; font-size: 1rem; font-weight: 600; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="" />
  <h1>Sem conexão com a internet</h1>
  <p>Seus dados ficam guardados com segurança no Moto Passaporte. Assim que a internet voltar, é só tentar de novo.</p>
  <button onclick="location.reload()">Tentar de novo</button>
</main>
</body>
</html>
